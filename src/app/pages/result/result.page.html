<ion-content [fullscreen]="true">
  <div class="result-container">

    <h1>Hoàn thành!</h1>
    <h2>{{ score }} / {{ total }}</h2>
    <p class="message">{{ getMessage() }}</p>

    <ion-button
      expand="block"
      (click)="playAgain()">
      Làm lại
    </ion-button>

    <ion-button
      expand="block"
      fill="outline"
      (click)="viewHistory()">
      Xem lịch sử
    </ion-button>

    <ion-button
      expand="block"
      fill="clear"
      (click)="goHome()">
      Về trang chủ
    </ion-button>

  </div>

</ion-content>
